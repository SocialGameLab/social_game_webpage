# Battle of the Sexes: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: battle_of_sexes
title: Battle of the Sexes
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Both players want to pick the same option, but each prefers a different
  one.
view: rounds
setup:
  - Two players choose `option_a` or `option_b` for 8 rounds.
  - Both on `option_a` scores 3 for P0 and 2 for P1.
  - Both on `option_b` scores 2 for P0 and 3 for P1.
  - Picking different options scores 0 for both.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `option_a` or `option_b` at the same
    time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `option_a` or `option_b`.
watch_for:
  - P0 proposes alternating, `option_a` on odd rounds and `option_b` on even
    rounds, in its first message, and both follow it without a miss for a 20
    to 20 tie.
runs:
  - id: battle_of_sexes
