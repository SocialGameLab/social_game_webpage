# Bayesian Persuasion: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_bayesian_persuasion
title: Bayesian Persuasion
kind: Signaling
players: 2 players · 5 rounds
tagline: >-
  A professor who knows whether a student is strong writes the letter, and
  an HR officer who never meets the student decides whether to hire. The
  professor gains from every hire, so how far should the letter be trusted?
view: rounds
page_link: {label: Chart replay, href: "eco/index.html#eco_bayesian_persuasion"}
setup:
  - The recording plays the recommendation-letter scenario, with the
    professor as sender and the HR officer as receiver, and the seed decides
    which seat is which.
  - Each round a new student is drawn, strong with probability 1/3, and only
    the professor learns which.
  - The professor earns 1 for every hire, and the HR officer earns +1 for
    hiring a strong student, -1 for hiring a weak one and 0 for not hiring.
  - The story, the prior and both payoff tables are public, but each player
    is told only its own payoff each round.
round:
  - Before the student is drawn, the professor publicly announces in words
    how it will write its letters (`pledge`), and nothing enforces it.
  - The student is drawn, and the professor writes a short message
    (`write`) and sends the label `recommend` or `not_recommend` (`signal`).
  - The HR officer sees the pledge, the message and the label but never the
    student, and plays `decide` with `hire` or `do_not_hire`.
  - Each player is told its own payoff, and the label and the decision
    become public.
win:
  - The game ends after 5 rounds.
  - Each player's reward is its mean payoff per round, scaled to lie in [-1,
    1], and the game names no winner.
  - The professor's best committed scheme recommends every strong student
    and half of the weak ones, which pays it 0.67 per round and leaves the
    HR officer 0.
agents:
  - Each turn the agent gets a text prompt with the rules, its role brief,
    the story and payoff tables, the pledges, labels and decisions so far,
    and the legal actions.
  - Only the professor's prompt holds the student's quality, and a round's
    message is shown only during that round.
  - It answers with one JSON action, such as `pledge` with a text, `signal`
    with a label or `decide` with an action.
watch_for:
  - The professor (P1) never lied, recommending all 3 strong students and
    none of the 2 weak ones, and from round 2 on every pledge promised to
    recommend only strong students.
  - The HR officer (P0) never hired and turned down all three true
    recommendations, in rounds 1, 4 and 5, so both rewards were 0.00.
  - Hiring after every recommendation would have given each player +3 (0.60
    per round), while the paper's agents reached 0.48 and 0.19 in this
    five-round setting.
runs:
  - id: eco_bayesian_persuasion
