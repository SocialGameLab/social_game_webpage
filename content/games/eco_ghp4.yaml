# Matrix game GHP4 (high stakes): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_ghp4
title: Matrix game GHP4 (high stakes)
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Game 4 of Goeree, Holt and Palfrey (2003), a matching-pennies game with
  big, uneven payoffs that make risk matter.
view: rounds
setup:
  - P0 picks the row and P1 the column of the same 2×2 game, played for 8
    rounds.
  - Picking A and A pays 200 and 160 to P0 and P1; A and B pays 160 and 10;
    B and A pays 370 and 200; B and B pays 10 and 370.
  - P0 does best by mismatching P1's choice and P1 by matching.
  - For P1, A is the safe choice (160 or 200) and B the risky one (10 or
    370).
  - The only equilibrium is mixed, with P0 playing A 53.1% of the time and
    P1 46.9%, while lab players chose A 47.0% and 65.0%.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `A` or `B` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `A` or `B`.
  - The prompt spells out the full payoff table.
watch_for:
  - Both seats say A almost every round, but P0 plays B while announcing A
    in rounds 2, 3, 7 and 8, collecting 370 whenever P1 sticks to A.
  - P1 pulls ahead 1100 to 590 with B in rounds 3 and 4 (370 each), but P0's
    B plays in rounds 7 and 8 win it the match 1690 to 1670.
runs:
  - id: eco_ghp4
