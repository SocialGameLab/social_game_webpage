# Matrix game SC1 (constant sum 18): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_sc1
title: Matrix game SC1 (constant sum 18)
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Game 1 of Selten and Chmura (2008), a lopsided matching-pennies game where
  P0 wants to match and P1 wants to differ.
view: rounds
setup:
  - P0 picks the row and P1 the column of the same 2×2 game, played for 8
    rounds.
  - Picking A and A pays 10 and 8 to P0 and P1; A and B pays 0 and 18; B and
    A pays 9 and 9; B and B pays 10 and 8.
  - P0 does best by matching P1's choice and P1 by mismatching, and every
    cell adds up to 18.
  - The only equilibrium is mixed, with P0 playing A 9.1% of the time and P1
    90.9%.
  - In the original lab study, played without talk, row players chose A 7.9%
    of the time and column players 69.0%.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `A` or `B` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `A` or `B`.
  - The prompt spells out the full payoff table.
watch_for:
  - Both seats settle on B for P0 and A for P1 in the first exchange and
    never leave it, so every round pays 9 and 9 and the match ends tied at
    72.
  - The talk is the same deal restated each round, with P1 adding that it
    would switch to B if P0 ever played A; nobody tests it.
runs:
  - id: eco_sc1
