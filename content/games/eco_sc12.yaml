# Matrix game SC12 (variable-sum SC6): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_sc12
title: Matrix game SC12 (variable-sum SC6)
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Game 12 of Selten and Chmura (2008), a matching-pennies game where P0
  wants to match and P1 wants to differ, and the payoffs do not sum to a
  constant.
view: rounds
setup:
  - P0 picks the row and P1 the column of the same 2×2 game, played for 8
    rounds.
  - Picking A and A pays 7 and 3 to P0 and P1; A and B pays 3 and 9; B and A
    pays 3 and 5; B and B pays 10 and 0.
  - P0 does best by matching P1's choice and P1 by mismatching, but each
    cell has a different total.
  - The only equilibrium is mixed, with P0 playing A 45.5% of the time and
    P1 63.6%, the same as SC6.
  - In the original lab study, played without talk, row players chose A
    43.9% of the time and column players 60.4%.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `A` or `B` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `A` or `B`.
  - The prompt spells out the full payoff table.
watch_for:
  - Both sides routinely break their announcements, and P0 says A in rounds
    3 and 4 but plays B both times, catching P1 (which said B) on the 10 to
    0 cell twice.
  - P1 lies too (it says A in rounds 2 and 6 and plays B for 9 to 3), but
    P0's three A/A rounds and two B/B rounds carry it to a 50 to 32 win.
runs:
  - id: eco_sc12
