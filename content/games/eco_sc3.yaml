# Matrix game SC3 (constant sum 14): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_sc3
title: Matrix game SC3 (constant sum 14)
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Game 3 of Selten and Chmura (2008), a lopsided matching-pennies game where
  P0 wants to match and P1 wants to differ.
view: rounds
setup:
  - P0 picks the row and P1 the column of the same 2×2 game, played for 8
    rounds.
  - Picking A and A pays 8 and 6 to P0 and P1; A and B pays 0 and 14; B and
    A pays 7 and 7; B and B pays 10 and 4.
  - P0 does best by matching P1's choice and P1 by mismatching, and every
    cell adds up to 14.
  - The only equilibrium is mixed, with P0 playing A 27.3% of the time and
    P1 90.9%.
  - In the original lab study, played without talk, row players chose A
    16.3% of the time and column players 79.3%.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `A` or `B` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `A` or `B`.
  - The prompt spells out the full payoff table.
watch_for:
  - In rounds 1 to 4 P0 announces A every time but plays it only in round 2,
    which is exactly when P1, having announced A, switches to B and takes 14
    to 0.
  - From round 5 both state B for P0 and A for P1 and stick to it, splitting
    7 and 7 four times, and P0 wins 58 to 54 on its early B/B rounds.
runs:
  - id: eco_sc3
