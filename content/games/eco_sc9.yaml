# Matrix game SC9 (variable-sum SC3): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: eco_sc9
title: Matrix game SC9 (variable-sum SC3)
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Game 9 of Selten and Chmura (2008), a matching-pennies game where P0 wants
  to match and P1 wants to differ, and the payoffs do not sum to a constant.
view: rounds
setup:
  - P0 picks the row and P1 the column of the same 2×2 game, played for 8
    rounds.
  - Picking A and A pays 8 and 9 to P0 and P1; A and B pays 3 and 17; B and
    A pays 7 and 7; B and B pays 13 and 4.
  - P0 does best by matching P1's choice and P1 by mismatching, but each
    cell has a different total.
  - The only equilibrium is mixed, with P0 playing A 27.3% of the time and
    P1 90.9%, the same as SC3.
  - In the original lab study, played without talk, row players chose A
    25.4% of the time and column players 82.7%.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `A` or `B` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `A` or `B`.
  - The prompt spells out the full payoff table.
watch_for:
  - Both agree on B/A from the first message, but P0 plays A while
    announcing B in rounds 1, 2, 7 and 8, and P1 plays B after announcing A
    in rounds 2 and 3.
  - The deal only holds in rounds 4 to 6 (7 each), and P1's 17 to 3 in round
    2 keeps it ahead to a 69 to 61 win.
runs:
  - id: eco_sc9
