# Hawk-Dove: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: hawk_dove
title: Hawk-Dove
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Also called Chicken. Each player acts tough or backs down, and two tough
  players both get hurt.
view: rounds
setup:
  - Two players choose hawk (aggressive) or dove (yielding) for 8 rounds.
  - Both hawk scores −2 each, and both dove scores 2 each.
  - A hawk facing a dove scores 4 and the dove scores 0.
  - Scores can go negative.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `hawk` or `dove` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `hawk` or `dove`.
watch_for:
  - Seven rounds of dove/dove at 2 each, with both promising to answer any
    hawk with hawk, end in round 8 when both say dove and both play hawk.
  - That final double hawk costs 2 each and leaves the scores tied at 12
    instead of 16.
runs:
  - id: hawk_dove
