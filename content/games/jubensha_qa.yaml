# Jubensha QA: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: jubensha_qa
title: Jubensha QA
kind: Murder mystery
players: 6–7 players · scored by an LLM judge
tagline: >-
  Each agent plays a character in a scripted murder mystery, with secrets
  to protect, and must answer the script's questions about what really
  happened.
setup:
  - Every seat secretly gets one character with a private brief (secrets,
    a personal timeline, relationships and motives).
  - Everyone shares the same public background story and clue cards.
  - Each seat is also told which questions point at itself, the ones it
    should defend.
round:
  - Characters introduce themselves once at the start.
  - For every question in the script, the table discusses it in public
    for two passes.
  - Each seat then picks a partner for a private chat of two messages
    each.
  - Every seat privately writes its own answer.
win:
  - There is no winner. After the game an LLM judge grades each answer
    against the script's answer key.
  - A seat's score is its share of correct answers. Defense measures how
    often others got a question about that seat wrong.
agents:
  - All turns are free text built from one long prompt that includes the
    brief, the background, every clue and the conversation so far.
  - Partner choice is a structured action that only the engine sees.
watch_for:
  - Use the lens to follow one character, including the whispers and
    answers only they could see.
  - Open the verdict panel after the last question to see answers next to
    the key, with the judge's reasoning.
run_label: Script
