    label: 社保 · Social insurance (administrative, 中文)
    note: >-
      A citizen against a social-insurance authority. The real court ruled
      for the plaintiff.
  - id: criminal
    path: recordings/legal_court/criminal
    case: configs/legal_court/criminal/2022_云28刑初32号
    label: 行贿 · Bribery (criminal, 中文)
