    note: >-
      A Chinese civil case over the return of a house built under a
      relative's name. The real court ruled for the defence.
  - id: admin
    label: 社保 · Social insurance (administrative, 中文)
    note: >-
      A citizen against a social-insurance authority that refused to open a
      case. The real court ruled for the plaintiff.
  - id: criminal
    label: 行贿 · Bribery (criminal, 中文)
    note: >-
      A bribery prosecution; the defence contests how the payments are
      characterised. The real court convicted.
  - id: ecthr
    label: Rõigas v. Estonia (ECtHR, Article 2)
    note: >-
      A mother says the investigation into her son's death in hospital was
      inadequate. The real Court found no violation.
  - id: singapore
    label: PP v the accused, [2004] SGHC 171 (Singapore, s 304A)
    note: >-
      Causing death by a negligent act after a naval collision. The real
      court convicted.
  - id: ecthr_nagy
    label: Béláné Nagy v. Hungary (ECtHR, Article 1 of Protocol No. 1)
    note: >-
      A disability pension withdrawn after the assessment method changed, then
      refused again under new contribution rules. The real Court found a
      violation.
