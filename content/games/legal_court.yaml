# Legal Court: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: legal_court
title: Legal Court
kind: Courtroom debate
players: 5 seats · 2 advocates, 3 jurors
tagline: >-
  Two advocates argue a real court case before a jury of three, revealing
  private evidence and citing statutes they can look up; the verdict is
  then scored against what the real court decided.
setup:
  - The case is real. The public record holds the facts and the plaintiff's
    claim, taken from a published judgment (Chinese civil, administrative and
    criminal courts, the European Court of Human Rights, or the Singapore
    courts).
  - One seat argues for the plaintiff (or applicant, or prosecution) and one
    for the defence (or the State, or the accused). Each privately holds up to
    five pieces of evidence, written for the game to fit the record.
  - Three jurors see only the public record and whatever is said or revealed
    in court. The real outcome stays sealed and never enters the game.
round:
  - Opening statements from both sides.
  - Seven argument rounds. Each turn an advocate makes one move, reveal a
    piece of evidence, rebut, or cite a statute, and may not repeat the same
    move twice in a row.
  - After every round the jurors vote privately and only the tally is shown,
    so both sides can see which way the jury is leaning and adapt.
  - Closing statements, then a binding majority verdict.
win:
  - The side the jury votes for wins the trial.
  - Outside the game the verdict is compared with the sealed real outcome,
    and each advocate is also scored on whether the statutes it cited are the
    ones that actually governed the case.
agents:
  - Advocates get the public record, their own unrevealed evidence, the
    argument so far and the jury's latest lean, and answer in free text with
    one move per turn.
  - Before citing law an advocate can search a statute library (the Chinese
    codes, the European Convention, or the Singapore Penal Code and Misuse of
    Drugs Act); citations are checked against it and unverifiable ones are
    marked.
  - Jurors score both sides on a rubric (legal grounding, evidence,
    responsiveness, factual consistency, logic) and vote; the three jurors
    may be different models.
watch_for:
  - Switch the lens to an advocate to see the evidence it is still holding
    back, and when it chooses to play each piece.
  - Watch the jury tally after each round and how the trailing side changes
    tactics.
  - Open the verdict panel at the end to see what the real court decided,
    which statutes governed the case, and how each side's citations matched
    them.
# Runs come from social-game-env's demo/legal_court/ (recorded there with
# `python -m runners demo record legal_court`; the six cases were drawn with
# its scripts/pick_demo_cases.py: one per case set with --seed 20261023, plus
# one more English case with --seed 1). Listed here for order, labels and notes.
