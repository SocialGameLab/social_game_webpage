# Biased Rock Paper Scissors: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: matrix_brps
title: Biased Rock Paper Scissors
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Rock Paper Scissors where each win is worth a different amount, so some
  throws are much riskier than others.
view: rounds
setup:
  - Two players play rock, paper, scissors for 8 rounds.
  - Rock beats scissors by 50, paper beats rock by 25, and scissors beats
    paper by 5.
  - The winner gains that amount and the loser loses it, and a tie scores 0
    for both.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose rock, paper or scissors at the same
    time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `rock`, `paper` or `scissors`.
  - The prompt says only that the payoffs are biased; the exact amounts show
    up in the round results.
watch_for:
  - The talk is the same promise to stay unpredictable every round, and
    nobody ever names a move.
  - One round decides the match, as P0's scissors loses to P1's rock for 50
    in round 6 and the two closing paper ties leave P1 ahead 50 to −50.
runs:
  - id: matrix_brps
