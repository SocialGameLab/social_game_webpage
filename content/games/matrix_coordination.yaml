# Coordination Game: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: matrix_coordination
title: Coordination Game
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Two players each pick left or right and score only when they pick the same
  side.
view: rounds
setup:
  - Two players play the same pick-a-side game for 8 rounds.
  - If both pick the same side, left or right, each scores 1.
  - If they pick different sides, both score 0.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `left` or `right` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `left` or `right`.
watch_for:
  - Degenerate run, as P0 proposes left, P1 agrees, and both pick left in
    all 8 rounds with the same message repeated, for an 8 to 8 tie.
runs:
  - id: matrix_coordination
