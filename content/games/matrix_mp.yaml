# Matching Pennies: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: matrix_mp
title: Matching Pennies
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Each round both players show heads or tails. P0 wins on a match and P1
  wins on a mismatch.
view: rounds
setup:
  - Two players play heads or tails for 8 rounds.
  - When the choices match, P0 scores +1 and P1 scores −1.
  - When they differ, P0 scores −1 and P1 scores +1.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `heads` or `tails` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `heads` or `tails`.
watch_for:
  - Both seats alternate heads and tails in lockstep for the first four
    rounds, so P0, the matcher, goes up 4 to −4 while both claim to be
    randomizing.
  - P1 breaks the pattern from round 5 and wins three of the last four
    rounds, but P0 holds on to win 2 to −2.
runs:
  - id: matrix_mp
