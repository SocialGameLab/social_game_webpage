# Rock Paper Scissors: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: matrix_rps
title: Rock Paper Scissors
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  The classic hand game, played for 8 rounds with a running score.
view: rounds
setup:
  - Two players play rock, paper, scissors for 8 rounds.
  - Rock beats scissors, scissors beats paper, and paper beats rock.
  - A win scores +1, a loss −1 and a tie 0.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose rock, paper or scissors at the same
    time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `rock`, `paper` or `scissors`.
watch_for:
  - Seven of the eight rounds are ties with both seats on the same throw,
    starting in round 1, where P0 says rock and P1 says paper but both play
    scissors.
  - The only decisive round is round 7, where P1's paper beats P0's rock, so
    P1 wins 1 to −1.
runs:
  - id: matrix_rps
