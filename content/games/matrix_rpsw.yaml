# Rock Paper Scissors Water: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: matrix_rpsw
title: Rock Paper Scissors Water
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Rock Paper Scissors with a fourth throw, water, that ties with everything.
view: rounds
setup:
  - Two players play rock, paper, scissors or water for 8 rounds.
  - Among rock, paper and scissors the usual rules apply, with +1 for a win,
    −1 for a loss and 0 for a tie.
  - Any round where someone plays water is a tie that scores 0 for both.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose rock, paper, scissors or water at the
    same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `rock`, `paper`, `scissors` or `water`.
watch_for:
  - The announcements are mostly false, as P0 says rock in rounds 2 and 3
    and plays scissors, and P1 says water in rounds 4, 5 and 7 but never
    plays it.
  - Water is played only once (P0 in round 1, as announced), and each side's
    two wins cancel out for a 0 to 0 draw.
runs:
  - id: matrix_rpsw
