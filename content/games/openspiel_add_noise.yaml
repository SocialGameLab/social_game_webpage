# Kuhn Poker with Noise: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_add_noise
title: Kuhn Poker with Noise
kind: OpenSpiel · hidden information
players: 2 players · zero-sum
tagline: Kuhn Poker, with small random noise added to each final payoff.
view: moves
setup:
- The game is three-card Kuhn Poker (J, Q, K), and each player antes 1 and holds one card.
- The wrapper `add_noise` shifts the final payoff by up to `epsilon=0.1`, drawn from the seed.
round:
- 'Players act in turn: check or bet 1, then call or fold against a bet.'
win:
- A fold loses the pot, and otherwise the higher card wins it.
- The return is the pot result plus the noise, so it is not a whole number.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 2 moves and ends with P0 ahead (P0 +2.01857, P1 -2.01857).
- Every move came from a parsed reply, with no fallbacks.
- The view is only a card number and a history such as `1b`, where `p` is pass and `b` is bet.
runs:
- id: openspiel_add_noise
