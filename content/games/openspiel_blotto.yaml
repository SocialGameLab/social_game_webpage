# Colonel Blotto: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_blotto
title: Colonel Blotto
kind: OpenSpiel · one-shot
players: 2 players · zero-sum
tagline: Split ten coins across three fields without seeing your opponent's split.
view: moves
setup:
- Each player has 10 coins and 3 fields.
- There are 66 possible splits.
round:
- Both players choose a split at the same time.
win:
- A player takes a field by placing more coins on it, and whoever takes more fields wins.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 1 round (2 moves) and ends with level returns (P0 0, P1 0).
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_blotto
