# Contract Bridge (Bidding): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_bridge
title: Contract Bridge (Bidding)
kind: OpenSpiel · hidden information
players: 4 players · zero-sum
tagline: Four players in two partnerships bid for a contract, and the cards are never played.
view: moves
setup:
- North and South play as partners against East and West, with seats P0 to P3 in that order.
- Each player is dealt 13 cards.
- With `use_double_dummy_result=True`, the tricks are worked out by a solver, so there is no card play.
round:
- Players bid in turn, starting with the dealer, and each bid must beat the last.
- Three passes in a row after a bid end the auction.
win:
- The contract is scored against the number of tricks a solver finds with all hands open.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 22 moves and ends with P1 and P3 ahead (P0 -2200, P1 +2200, P2 -2200, P3 +2200).
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_bridge
