# Cliff Walking: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_cliff_walking
title: Cliff Walking
kind: OpenSpiel · single player
players: 1 player
tagline: Walk along a cliff edge to the goal in as few steps as you can.
view: moves
setup:
- The agent `P` starts in one bottom corner and the goal `G` is in the other.
- The cells `X` between them are the cliff.
round:
- The agent moves one cell at a time.
win:
- Each step costs 1, stepping off the cliff costs 100, and the best possible return here is -9.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 11 moves and ends with a return of -11.
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_cliff_walking
