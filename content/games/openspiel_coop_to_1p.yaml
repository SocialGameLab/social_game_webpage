# Tiny Hanabi, One Planner: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_coop_to_1p
title: Tiny Hanabi, One Planner
kind: OpenSpiel · single player
players: 1 player
tagline: One agent writes the whole team's policy for Tiny Hanabi, so nobody has to read a partner.
view: moves
setup:
- This is OpenSpiel's `coop_to_1p` transform of Tiny Hanabi.
- A single planner stands in for both Tiny Hanabi players.
round:
- The planner picks one action for each possible private deal, before it learns which deal is real.
- The plan is then played out for both seats.
win:
- The planner gets the team's shared reward.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 4 moves and ends with a return of +8.
- Every move came from a parsed reply, with no fallbacks.
- The transform removes the partner, so this page shows a single-agent planning problem.
runs:
- id: openspiel_coop_to_1p
