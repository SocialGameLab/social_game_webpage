# Dark Chess: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_dark_chess
title: Dark Chess
kind: OpenSpiel · hidden information
players: 2 players · zero-sum
tagline: Chess where you only see the squares your own pieces can reach.
view: moves
setup:
- The pieces start as in chess, and P1 plays White.
- Each view hides the squares a player's pieces cannot reach.
round:
- Players move in turn, as in chess.
win:
- Nobody is told about check, and capturing the enemy king wins.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 11 moves and ends with P1 ahead (P0 -1, P1 +1).
- Every move came from a parsed reply, with no fallbacks.
- The board shows only the last view, while each agent keeps its own earlier views as history.
runs:
- id: openspiel_dark_chess
