# Deep Sea: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_deep_sea
title: Deep Sea
kind: OpenSpiel · single player
players: 1 player
tagline: Dive down a five-row grid, paying a small cost for every move right.
view: moves
view_options:
  wrap: 6
setup:
- The agent `x` starts at the top left of a 6-column grid and drops one row per move.
- '`randomize_actions=True` swaps what left and right mean from cell to cell.'
round:
- The agent picks left or right at each row.
win:
- Only the reward in the bottom right corner pays, and each move right costs a little.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 5 moves and ends with a return of -0.006.
- Every move came from a parsed reply, with no fallbacks.
- The swapped actions can only be learned over many episodes, and this page shows one.
runs:
- id: openspiel_deep_sea
