# Dou Dizhu: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_dou_dizhu
title: Dou Dizhu
kind: OpenSpiel · hidden information
players: 3 players · zero-sum
tagline: 'Three players fight to empty their hands first: one landlord against two peasants.'
view: moves
setup:
- Each player gets 17 cards, and the remaining 3 go to the landlord.
- Players bid to become the landlord.
round:
- The landlord leads, and each player must beat the last play or pass.
- Bombs and the rocket beat other combinations and double the stakes.
win:
- The landlord wins by emptying their hand first, and otherwise the peasants win together.
- The landlord pays or receives from both peasants.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 34 moves and ends with P0 and P1 ahead (P0 +6, P1 +6, P2 -12).
- Every move came from a parsed reply, with no fallbacks.
- The prompt shows the landlord's 3 extra cards after the bidding, but the raw view on this board does
  not.
- The prompt adds each player's cards left and the recent plays, which the raw view leaves out.
runs:
- id: openspiel_dou_dizhu
