# Sample Bayesian Game: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_efg_game
title: Sample Bayesian Game
kind: OpenSpiel · hidden information
players: 2 players · general-sum
tagline: 'OpenSpiel''s sample game file: a one-stage game where each player has a private type.'
view: moves
setup:
- This is the example file `sample.efg`, a general Bayesian game with one stage.
- Chance gives each player a private type.
round:
- Each player picks one action, knowing only its own type.
win:
- Payoffs come from a table in the game file.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 2 moves and ends with returns of P0 +4, P1 +2.
- Every move came from a parsed reply, with no fallbacks.
- The states are codes such as `0-0-2-(1,2)`, so a reader cannot follow the game from this page.
runs:
- id: openspiel_efg_game
