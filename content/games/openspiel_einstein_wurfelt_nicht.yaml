# EinStein würfelt nicht!: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_einstein_wurfelt_nicht
title: EinStein würfelt nicht!
kind: OpenSpiel · perfect information
players: 2 players · zero-sum
tagline: Race a piece into the far corner on a 5×5 board, moving whichever piece the die names.
view: moves
setup:
- Each player has six numbered pieces in opposite corners of a 5×5 board.
round:
- A die names the piece to move, or the next higher or lower one if that piece is gone.
- The piece steps toward the far corner, and it captures whatever stands there, even a piece of its own.
win:
- A player wins by reaching the far corner or by removing all enemy pieces.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 20 moves and ends with P0 ahead (P0 +1, P1 -1).
- Every move came from a parsed reply, with no fallbacks.
- The die roll appears only through the legal moves, and `*` marks a capture.
runs:
- id: openspiel_einstein_wurfelt_nicht
