# Euchre: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_euchre
title: Euchre
kind: OpenSpiel · hidden information
players: 4 players · zero-sum
tagline: Two partnerships play one hand of five-trick trumps.
view: moves
setup:
- North and South play as partners against East and West, with a 24-card deck.
- Each player gets five cards.
round:
- 'Players choose trump: the label `Spades` here means order up, and `Partner` means play without going
  alone.'
- Players then play five tricks, following suit when they can.
win:
- The side that chose trump scores 1 for 3 or 4 tricks and 2 for all five.
- If that side falls short, the other side scores 2.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 24 moves and ends with P1 and P3 ahead (P0 -1, P1 +1, P2 -1, P3 +1).
- Every move came from a parsed reply, with no fallbacks.
- This is a single hand, not a match to 10 points.
runs:
- id: openspiel_euchre
