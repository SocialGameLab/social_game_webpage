# Hearts: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_hearts
title: Hearts
kind: OpenSpiel · hidden information
players: 4 players · general-sum
tagline: Avoid hearts and the queen of spades across one four-player hand.
view: moves
setup:
- Four players each get 13 cards, then pass three cards.
- Each heart is a penalty point, and the queen of spades is 13.
round:
- Players play 13 tricks, following suit when they can.
win:
- Each return here is 26 minus that player's penalty points, so higher is better.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 64 moves and ends with returns of P0 +19, P1 +7, P2 +26, P3 +26.
- Every move came from a parsed reply, with no fallbacks.
- This is a single hand, not a match to 100 points.
runs:
- id: openspiel_hearts
