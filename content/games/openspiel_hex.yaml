# Hex: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_hex
title: Hex
kind: OpenSpiel · perfect information
players: 2 players · zero-sum
tagline: Connect your two edges of an 11×11 board before your opponent connects theirs.
view: moves
setup:
- P0 plays `x` and connects top to bottom.
- P1 plays `o` and connects left to right.
- There is no swap rule, so the first player has an edge.
round:
- Players place one stone in turn on any empty cell.
win:
- The first unbroken chain between a player's edges wins, and draws are impossible.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 35 moves and ends with P0 ahead (P0 +1, P1 -1).
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_hex
