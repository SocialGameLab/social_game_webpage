# Laser Tag: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_laser_tag
title: Laser Tag
kind: OpenSpiel · perfect information
players: 2 players · general-sum
tagline: Two players turn, move and fire on a small grid.
view: moves
setup:
- Players `A` and `B` start in corners of a 7×7 grid, and `*` marks walls.
- '`Orientations` gives each player''s facing direction.'
- The game stops after `horizon=1000` rounds.
round:
- Both players choose to turn, move, stand or fire at the same time.
win:
- A player scores by tagging the other with a shot.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 1000 rounds (2000 moves) and ends with returns of P0 +105, P1 +72.
- Every move came from a parsed reply, with no fallbacks.
- '`move forward` is the most common move at 539, and `fire` makes up 15% of all moves.'
runs:
- id: openspiel_laser_tag
