# Lewis Signaling: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_lewis_signaling
title: Lewis Signaling
kind: OpenSpiel · hidden information
players: 2 players · general-sum
tagline: A sender sees a hidden state and sends a message; a receiver must guess the state.
view: moves
setup:
- Chance picks a state that only the sender sees.
- The sender and receiver share the same payoff.
round:
- The sender picks a message.
- The receiver picks an action after seeing only the message.
win:
- Both score when the action matches the state.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 2 moves and ends with level returns (P0 +1, P1 +1).
- Every move came from a parsed reply, with no fallbacks.
- State, message and action numbers line up, so matching numbers already works without a learned convention.
runs:
- id: openspiel_lewis_signaling
