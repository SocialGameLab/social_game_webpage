# Lines of Action: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_lines_of_action
title: Lines of Action
kind: OpenSpiel · perfect information
players: 2 players · zero-sum
tagline: Connect all your pieces into one group before your opponent does.
view: moves
setup:
- P0 plays `x` and P1 plays `o`, each starting on opposite edges of an 8×8 board.
round:
- A piece moves as many squares as there are pieces on that line.
- It may jump its own pieces, may not jump enemy pieces, and captures by landing on one.
win:
- The first player with all its pieces in one connected group wins.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 47 moves and ends with P1 ahead (P0 -1, P1 +1).
- Every move came from a parsed reply, with no fallbacks.
- In a move's label `x` marks a capture, which is separate from the `x` pieces on the board.
runs:
- id: openspiel_lines_of_action
