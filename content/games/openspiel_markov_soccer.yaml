# Markov Soccer: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_markov_soccer
title: Markov Soccer
kind: OpenSpiel · perfect information
players: 2 players · zero-sum
tagline: Two players chase one ball on a small grid and try to score.
view: moves
setup:
- Players `a` and `b` share a grid, and `O` is the free ball.
- A capital `A` or `B` is that player holding the ball.
round:
- Both players pick a direction or stand at the same time, and their moves resolve in random order.
win:
- Carrying the ball into the opposing goal scores and ends the game.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 6 rounds (12 moves) and ends with P0 ahead (P0 +1, P1 -1).
- Every move came from a parsed reply, with no fallbacks.
- The prompt says which edge each player scores on, but the board does not.
runs:
- id: openspiel_markov_soccer
