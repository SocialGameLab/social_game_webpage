# Chicken: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_matrix_cd
title: Chicken
kind: OpenSpiel · one-shot
players: 2 players · general-sum
tagline: Dare or swerve at the same moment, and crash if neither of you swerves.
view: moves
setup:
- Each player chooses Dare or Chicken once, at the same time.
round:
- Both choices are revealed together.
win:
- Both Dare scores 0 each, and both Chicken scores 3 each.
- A lone Dare scores 4 and its opponent scores 1.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 1 round (2 moves) and ends with level returns (P0 +3, P1 +3).
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_matrix_cd
