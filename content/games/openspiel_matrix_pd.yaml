# Prisoner's Dilemma: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_matrix_pd
title: Prisoner's Dilemma
kind: OpenSpiel · one-shot
players: 2 players · general-sum
tagline: Cooperate or defect once, at the same time as your opponent.
view: moves
setup:
- Each player chooses Cooperate or Defect once, at the same time.
round:
- Both choices are revealed together.
win:
- Both Cooperate scores 5 each, and both Defect scores 1 each.
- A lone Defect scores 10 and its opponent scores 0.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 1 round (2 moves) and ends with level returns (P0 +1, P1 +1).
- Every move came from a parsed reply, with no fallbacks.
- One round can show a choice, but not reciprocity.
runs:
- id: openspiel_matrix_pd
