# Mean Field Dynamic Routing: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_mfg_dynamic_routing
title: Mean Field Dynamic Routing
kind: OpenSpiel · single player
players: 1 player
tagline: One representative vehicle picks a route to its destination through a road network.
view: moves
setup:
- One agent routes a vehicle through a small road network.
- The other traffic is a fixed uniform baseline, so it never reacts to the agent.
round:
- The agent picks the next road at each junction.
- Steps with one legal move still count as moves.
win:
- The agent's return is its travel cost, so nearer zero is better.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 10 moves and ends with a return of -4.
- Every move came from a parsed reply, with no fallbacks.
- The real game's congestion effect, Braess's paradox, cannot appear with a fixed population.
runs:
- id: openspiel_mfg_dynamic_routing
