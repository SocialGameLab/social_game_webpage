# Negotiation: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_negotiation
title: Negotiation
kind: OpenSpiel · hidden information
players: 2 players · general-sum
tagline: Two players bargain over a pool of items, each knowing only its own values.
view: moves
setup:
- Chance sets a pool of three item types and gives each player private values.
- The game can end at a turn limit with no deal.
round:
- Players take turns; each proposes a split and may add an utterance of symbols.
- A player can accept the last proposal instead.
win:
- With a deal, each player scores its own values times its share of items.
- Without a deal, both score 0.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 7 moves and ends with returns of P0 +69, P1 +60.
- Every move came from a parsed reply, with no fallbacks.
- 'Labels don''t say whose share a proposal gives, and accept reads `Proposal: Agreement reached!`.'
- Utterances are numbers with no agreed meaning, so this isn't free talk.
runs:
- id: openspiel_negotiation
