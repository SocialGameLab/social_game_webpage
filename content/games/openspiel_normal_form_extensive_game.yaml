# Rock, Paper, Scissors (Normal Form): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_normal_form_extensive_game
title: Rock, Paper, Scissors (Normal Form)
kind: OpenSpiel · one-shot
players: 2 players · zero-sum
tagline: Rock, Paper, Scissors through OpenSpiel's normal-form wrapper.
view: moves
setup:
- Both players pick once, at the same time.
round:
- Both choices are revealed together.
win:
- Rock beats scissors, scissors beats paper and paper beats rock, and a tie scores 0.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 1 round (2 moves) and ends with P1 ahead (P0 -1, P1 +1).
- Every move came from a parsed reply, with no fallbacks.
- The wrapper's labels are internal text ending in `action = 0`, 1 or 2, so agents never see the words
  rock, paper or scissors.
runs:
- id: openspiel_normal_form_extensive_game
