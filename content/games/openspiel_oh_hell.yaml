# Oh Hell!: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_oh_hell
title: Oh Hell!
kind: OpenSpiel · hidden information
players: 3 players · general-sum
tagline: Bid exactly how many tricks you will take, then try to hit that number.
view: moves
setup:
- Each player is dealt a hand, and a card turned up sets the trump suit.
round:
- Each player bids a number of tricks.
- Players then play the tricks, following suit when they can.
win:
- A player scores 1 per trick, plus a 10-point bonus for making its bid exactly.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 48 moves and ends with returns of P0 +7, P1 +13, P2 +5.
- Every move came from a parsed reply, with no fallbacks.
- '`Bids: -1` in the view marks a player who hasn''t bid yet.'
runs:
- id: openspiel_oh_hell
