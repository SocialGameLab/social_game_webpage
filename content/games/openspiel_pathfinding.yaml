# Pathfinding: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_pathfinding
title: Pathfinding
kind: OpenSpiel · single player
players: 1 player
tagline: Reach your goal on a small grid; this run has one player, so nothing blocks the way.
view: moves
setup:
- The grid has walls `*`, and uppercase letters mark goals.
- OpenSpiel's default is `players=1`, though the game supports several.
round:
- The agent moves one cell at a time.
win:
- Reaching the goal pays 100, plus 100 when all players are done, and each step costs 0.01.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 9 moves and ends with a return of +199.92.
- Every move came from a parsed reply, with no fallbacks.
- The game's real interest is players blocking each other, which needs at least two.
runs:
- id: openspiel_pathfinding
