# Phantom Tic-Tac-Toe: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_phantom_ttt
title: Phantom Tic-Tac-Toe
kind: OpenSpiel · hidden information
players: 2 players · zero-sum
tagline: Tic-Tac-Toe where you can't see your opponent's marks until you bump into them.
view: moves
setup:
- P0 plays `x` and P1 plays `o` on a 3×3 grid.
- Each view shows only your marks and the enemy marks you have found.
round:
- Players pick a cell in turn.
- Picking an occupied cell reveals it and the same player picks again.
win:
- Three in a row wins, and a full board is a draw.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 12 moves and ends with P0 ahead (P0 +1, P1 -1).
- Every move came from a parsed reply, with no fallbacks.
- The second line of the view, such as `1,4 1,0`, is a raw history of player and cell.
runs:
- id: openspiel_phantom_ttt
