# Reconnaissance Blind Chess: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_rbc
title: Reconnaissance Blind Chess
kind: OpenSpiel · hidden information
players: 2 players · zero-sum
tagline: 'Chess without seeing your opponent: sense a small area, then move.'
view: moves
setup:
- The pieces start as in chess, and P1 plays White.
- Each view shows only your own pieces, so empty squares may hide enemy pieces.
round:
- Each turn starts with a sense that reveals a 3×3 area.
- '`Sense d3` names that area''s lower-left square, with `sense_centered=False`.'
- The player then tries a move, which may fail if an unseen piece blocks it.
win:
- Capturing the enemy king wins.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 60 moves and ends with P0 ahead (P0 +1, P1 -1).
- Every move came from a parsed reply, with no fallbacks.
- A sense result shows only for the move right after it, and agents keep no memory, so what was sensed
  is soon lost.
runs:
- id: openspiel_rbc
