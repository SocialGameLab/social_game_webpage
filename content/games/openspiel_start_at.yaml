# Tic-Tac-Toe via StartAt: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_start_at
title: Tic-Tac-Toe via StartAt
kind: OpenSpiel · perfect information
players: 2 players · zero-sum
tagline: Tic-Tac-Toe through OpenSpiel's start_at wrapper, with an empty starting history.
view: moves
setup:
- The wrapper `start_at` begins a game from a given history, and here that history is empty.
- 'This makes the game plain Tic-Tac-Toe: P0 plays `x`, P1 plays `o`.'
round:
- Players mark one empty cell in turn.
win:
- Three in a row wins, and a full board is a draw.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 9 moves and ends with level returns (P0 0, P1 0).
- Every move came from a parsed reply, with no fallbacks.
runs:
- id: openspiel_start_at
