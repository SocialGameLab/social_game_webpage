# Slovenian Tarok: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_tarok
title: Slovenian Tarok
kind: OpenSpiel · hidden information
players: 3 players · general-sum
tagline: Three players bid and play tricks with a 54-card tarok deck.
view: moves
setup:
- Three players get 16 cards each, and 6 more form the talon.
- 'The deck has 54 cards: 22 taroks and 32 suit cards.'
round:
- Players bid for a contract, and the winner may take cards from the talon.
- Players then play tricks, following suit when they can.
win:
- The declarer's side scores by card points, and bonuses such as a captured Mond are added on top.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- The prompt names the game but gives no rules or payoffs, so the agent has to know them already.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 55 moves and ends with returns of P0 -31, P1 -20, P2 0.
- Every move came from a parsed reply, with no fallbacks.
- In the bidding phase, the state shows the hand as bare card numbers such as `0,1,6,7`, so an agent can't
  read its cards.
- A score of 0 can still come out on top, so read the returns and not the order.
runs:
- id: openspiel_tarok
