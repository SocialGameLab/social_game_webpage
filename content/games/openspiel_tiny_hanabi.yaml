# Tiny Hanabi: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_tiny_hanabi
title: Tiny Hanabi
kind: OpenSpiel · hidden information
players: 2 players · cooperative
tagline: Two partners each hold a private card and must coordinate from a single move each.
view: moves
setup:
- Each player is dealt a private card, shown as `p0:d1` style text.
- Both players share one reward.
round:
- Player 0 picks an action.
- Player 1 sees that action and picks its own.
win:
- A payoff table gives the shared reward for each deal and pair of actions.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 2 moves and ends with level returns (P0 +8, P1 +8).
- Every move came from a parsed reply, with no fallbacks.
- The table isn't in the prompt, so one good result can't be told apart from luck.
runs:
- id: openspiel_tiny_hanabi
