# Universal Poker (6-Rank Hold'em): page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: openspiel_universal_poker
title: Universal Poker (6-Rank Hold'em)
kind: OpenSpiel · hidden information
players: 2 players · zero-sum
tagline: Two-player no-limit poker with six ranks, one hole card and one board card.
view: moves
setup:
- The deck has 6 ranks in 4 suits.
- Each player gets 1 hole card, and 1 board card follows in the second round.
- Blinds are 100 each and stacks are 1,200.
round:
- Players can fold, call, bet the pot or go all-in in each of two betting rounds.
win:
- A fold loses the pot, and otherwise the best hand at showdown wins it.
agents:
- Each turn the agent gets a text rendering of its view of the state and every legal move with its number
  and label.
- It answers with one JSON action naming a move; a reply that is rejected or missing after retries plays
  the lowest legal move, flagged as a fallback.
watch_for:
- This run lasts 5 moves and ends with P0 ahead (P0 +900, P1 -900).
- Every move came from a parsed reply, with no fallbacks.
- The state line is OpenSpiel's raw format, including its own typo `BettingAbstration`.
runs:
- id: openspiel_universal_poker
