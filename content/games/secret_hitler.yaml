# Secret Hitler: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: secret_hitler
title: Secret Hitler
kind: Hidden roles
players: 5 players · 3 liberals, 1 fascist, Hitler
tagline: >-
  Liberals try to pass liberal policies while a hidden fascist minority,
  and Hitler, steer the deck their way.
setup:
  - Each seat secretly gets a role. Three are Liberals; the Fascist team
    is one Fascist and Hitler.
  - At five players the Fascist and Hitler know each other. Liberals know
    nothing.
  - The policy deck holds 6 Liberal and 11 Fascist cards.
round:
  - The President nominates a Chancellor, and every living player votes
    Ja or Nein.
  - Three failed elections in a row enact the top policy automatically.
  - An elected President draws three policies, discards one in secret
    and passes two to the Chancellor, who enacts one.
  - Some Fascist policies grant the President a power, such as a peek at
    the deck or an execution.
  - The presidency then passes to the next seat.
win:
  - Liberals win on 5 Liberal policies or by executing Hitler.
  - Fascists win on 6 Fascist policies, or by electing Hitler Chancellor
    after 3 Fascist policies.
agents:
  - Each turn the agent gets a text prompt with its role, private
    knowledge, the public state, recent events and the legal actions.
  - Nominations, votes and policy choices come back as one JSON action.
  - Only the President and Chancellor see the cards they hold.
watch_for:
  - Hitler (P0), as President, discards the Liberal card and hands the
    Fascist P3 two Fascist policies. Watch it from either Fascist's lens.
  - After the fourth Fascist policy Hitler executes a Liberal, then a
    veto and two chaos policies stall the game before the last Liberal
    policy wins it.
runs:
  - id: secret_hitler
