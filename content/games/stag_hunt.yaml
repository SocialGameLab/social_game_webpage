# Stag Hunt: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: stag_hunt
title: Stag Hunt
kind: Matrix games
players: 2 players · 8 rounds
tagline: >-
  Hunting stag together pays best, but only if the other player joins in;
  hare is the safe choice.
view: rounds
setup:
  - Two players choose stag or hare for 8 rounds.
  - Both stag scores 4 each, and both hare scores 3 each.
  - A stag hunter whose partner picks hare scores 0, and the hare hunter
    scores 3.
round:
  - Each player sends one public, non-binding message, P0 first.
  - Both players then secretly choose `stag` or `hare` at the same time.
  - The choices are revealed together and each payoff is added to that
    player's score.
win:
  - The game ends after 8 rounds.
  - Each seat's reward is its own total score; the higher total is recorded
    as the winner and equal totals are a draw.
agents:
  - Each turn the agent gets a text prompt with the game description, the
    scores, the most recent public events (past choices and messages) and
    the legal actions.
  - The message and the choice each come back as one JSON action, `talk`
    with free text or `choose` with `stag` or `hare`.
watch_for:
  - Uneventful run, as both pick stag in all 8 rounds and finish tied at 32,
    with each message just restating the streak.
runs:
  - id: stag_hunt
