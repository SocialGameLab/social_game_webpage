# Trade with Signals: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: trade_comm
title: Trade with Signals
kind: Negotiation
players: 2 players · one trade
tagline: >-
  Two players each hold a secret item and can send just one symbol. They
  score only if both name the exact swap.
view: deals
setup:
  - Each player is secretly dealt an item, numbered 0 to 4.
  - Neither player sees the other's item.
round:
  - Each player, P0 first, sends one public symbol from 0 to 4 instead of
    words.
  - Each player then secretly proposes a trade, naming the item they give
    and the item they want.
win:
  - Both players score 1 if each gives their own true item and asks for
    the other's true item.
  - Otherwise both score 0, so the two players win or lose together.
agents:
  - Each agent sees its own item, the rules and any symbol already sent.
  - The symbol and the trade each come back as one JSON action; there is
    no free-text talk.
watch_for:
  - A one-shot exchange where, as each seat's lens shows, P0 holds item 0
    and P1 holds item 2; each named its own item, they proposed the matching
    swap and it succeeded for 1 point each.
runs:
  - id: trade_comm
