# Ultimatum Game: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
id: ultimatum
title: Ultimatum Game
kind: Negotiation
players: 2 players · one offer
tagline: >-
  A proposer offers a split of 100 points, and the responder takes it or
  leaves it. If they say no, nobody gets anything.
view: deals
setup:
  - One player is the Proposer and the other is the Responder.
  - The pie of 100 points is public.
  - The Responder secretly learns an outside option between 0 and 40,
    which is only a reference point and is not paid out.
round:
  - The Proposer and then the Responder each send one free, unscored
    message.
  - The Proposer makes one binding offer of how many points, from 0 to
    100, go to the Responder, with a short message.
  - The Responder replies and chooses to accept or reject, which ends the
    game.
win:
  - On accept, the Responder gets the offer and the Proposer keeps the
    rest of the 100.
  - On reject, both get 0.
  - There is no winner; each seat's reward is its own point total.
agents:
  - Each agent sees the pie, the messages and the offer, and only the
    Responder sees its outside option.
  - Messages, the offer and the accept or reject decision each come back
    as one JSON action.
watch_for:
  - Pick P0's lens to see that the responder's real outside option is 1, yet
    it told P1 it was 40, the maximum possible.
  - P1 offered exactly 40 and P0 accepted, so the bluff earned P0 40 of the
    100-point pie and P1 kept 60.
runs:
  - id: ultimatum
