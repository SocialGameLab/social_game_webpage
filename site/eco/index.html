<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco Game Replays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: an analyst's replay desk. A left rail lists all 50 games by category with their recording status;
   the main column shows the selected game: summary tiles, a playback bar, a decision timeline with one lane
   per player, the game's charts on a shared step axis, and a sticky ticket (decision / observation).
   Served by the Match Room at eco/; data/<game>.js is written by tools/eco_charts (see its README). */
:root {
  --bg: #f4f5f7; --surface: #ffffff; --raise: #f9fafb; --ink: #12151a; --ink-2: #464c58; --ink-3: #7a8190;
  --rule: #e1e4e9; --grid: #edf0f3; --sel: #12151a; --focus: #2a78d6; --accent: #2a78d6;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --hold: #8a909c; --muted: #a3a9b4;
  --shadow: 0 1px 2px rgba(18,21,26,.05), 0 6px 18px rgba(18,21,26,.05);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1013; --surface: #161a1f; --raise: #1b1f25; --ink: #f0f2f5; --ink-2: #b4bac5; --ink-3: #848b98; --rule: #282d35; --grid: #1f232a; --sel: #f0f2f5; --focus: #3987e5; --accent: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --hold: #8d94a1; --muted: #5b616c; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #161a1f; --raise: #1b1f25; --ink: #f0f2f5; --ink-2: #b4bac5; --ink-3: #848b98; --rule: #282d35; --grid: #1f232a; --sel: #f0f2f5; --focus: #3987e5; --accent: #3987e5;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --hold: #8d94a1; --muted: #5b616c; --shadow: none; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.55; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 268px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: calc(100vh - env(safe-area-inset-top, 0px)); overflow: auto;
  background: var(--surface); border-right: 1px solid var(--rule); padding-block: 20px 28px; padding-inline: 16px; display: grid; align-content: start; gap: 18px; }
.brand { display: grid; gap: 4px; }
.brand b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.brand span { font-size: 12px; color: var(--ink-3); }
.cover { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); }
.meter { height: 6px; border-radius: 999px; background: var(--bg); overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }
.group { display: grid; gap: 2px; }
.group h3 { margin: 0 0 4px; font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.game { display: grid; grid-template-columns: 10px minmax(0, 1fr); align-items: center; gap: 9px; text-align: left; background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; color: var(--ink-2); }
.game:hover { background: var(--bg); color: var(--ink); }
.game[aria-current="true"] { background: var(--ink); color: var(--surface); }
.game .dot { width: 8px; height: 8px; border-radius: 50%; }
.game .nm { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legendrail { display: grid; gap: 4px; font-size: 11.5px; color: var(--ink-3); }
.legendrail span { display: inline-flex; align-items: center; gap: 7px; }
.picker { display: none; }
.content { min-width: 0; padding-block: 22px 56px; padding-inline: 24px; display: grid; gap: 16px; align-content: start; max-width: 1280px; }
header.gh { display: grid; gap: 6px; }
.eyebrow { font: 500 12px/1.4 var(--mono); color: var(--ink-3); letter-spacing: .02em; }
h1 { margin: 0; font-size: 27px; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
.lede { margin: 0; color: var(--ink-2); max-width: 82ch; }
/* The same three views as the game's Match Room page; this page is the third. */
.mr-switch { justify-self: start; margin-top: 4px; }
.mr-switch a { font: 500 13px var(--sans); color: var(--ink-2); text-decoration: none; border-radius: 6px; padding: 5px 12px; }
.mr-switch a:hover { color: var(--ink); }
.mr-switch a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px 12px; display: grid; gap: 2px; min-width: 0; box-shadow: var(--shadow); }
.tile .k { font-size: 12px; color: var(--ink-3); }
.tile .v { font: 500 24px/1.25 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; letter-spacing: -.01em; }
.tile .s { font-size: 12px; color: var(--ink-2); }
.tile svg { display: block; width: 100%; height: 36px; margin-top: 6px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 9px 12px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--sans); background: var(--raise); border: 1px solid var(--rule); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); min-width: 84px; justify-content: center; }
.seg { display: inline-flex; gap: 2px; background: var(--bg); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.seg button { font: 500 12px var(--sans); border: 0; background: none; color: var(--ink-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.hint { font-size: 12px; color: var(--ink-3); margin-left: auto; }
kbd { font: 500 11px var(--mono); padding: 1px 5px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; background: var(--raise); }
.main { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.stack { display: grid; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px 12px; min-width: 0; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.panel .sub { margin: 0 0 8px; font-size: 12px; color: var(--ink-3); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 8px; font-size: 12px; color: var(--ink-2); margin: 0 0 6px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); cursor: pointer; user-select: none; background: var(--raise); }
.legend .item:hover { border-color: var(--ink-3); }
.legend .item[aria-pressed="false"] { opacity: .45; text-decoration: line-through; }
.legend .static { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; }
.sw { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.ln { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; user-select: none; }
.chart svg.plot { cursor: crosshair; }
.chart text { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
.chart .lane-label { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--rule); border-radius: 9px;
  padding: 8px 10px; font: 12px/1.55 var(--mono); color: var(--ink); box-shadow: 0 8px 24px rgba(0,0,0,.16); white-space: nowrap; z-index: 3; }
.tip b { font-weight: 500; }
.ticket { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); display: grid; gap: 12px; max-height: calc(100vh - 28px); overflow: auto; }
.nav { display: flex; align-items: center; gap: 8px; }
.nav input { flex: 1; min-width: 0; accent-color: var(--ink); }
.count { font: 500 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
.who { font: 500 12px var(--sans); padding: 2px 9px; border-radius: 999px; background: var(--bg); color: var(--ink-2); border: 1px solid var(--rule); }
.ttabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); }
.ttabs button { font: 500 13px var(--sans); background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; margin-bottom: -1px; color: var(--ink-3); cursor: pointer; }
.ttabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.pane { display: grid; gap: 12px; }
.actcard { display: grid; gap: 8px; background: var(--raise); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; }
.pill { justify-self: start; font: 600 12px var(--sans); padding: 3px 10px; border-radius: 999px; color: #fff; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px/1.4 var(--mono); padding: 3px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2); max-width: 100%; overflow-wrap: anywhere; }
.chip b { color: var(--ink); font-weight: 500; }
.label { font-size: 11px; font-weight: 600; color: var(--ink-3); letter-spacing: .08em; text-transform: uppercase; margin: 0 0 6px; }
.conclusion { margin: 0; font-size: 13px; line-height: 1.65; color: var(--ink); background: var(--raise); border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.box { font: 12.5px/1.6 var(--mono); color: var(--ink-2); white-space: pre-wrap; word-break: break-word; background: var(--bg);
  border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; max-height: 60vh; overflow: auto; margin: 0; }
.meta { font-size: 12px; color: var(--ink-3); }
.loading { color: var(--ink-3); padding: 40px 0; }
.status { display: inline-flex; align-items: center; gap: 7px; font: 500 12px var(--sans); padding: 3px 10px; border-radius: 999px; background: var(--raise); border: 1px solid var(--rule); }
.placeholder { display: grid; gap: 14px; max-width: 760px; }
.placeholder .panel p { margin: 0; color: var(--ink-2); }
footer { font-size: 12px; color: var(--ink-3); max-width: 96ch; }
.feed { display: grid; gap: 8px; max-height: 420px; overflow: auto; padding-right: 4px; }
.fe { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 4px 12px; padding: 8px 10px; border-radius: 9px; border: 1px solid transparent; }
.fe.now { background: var(--raise); border-color: var(--rule); }
.fe.later { display: none; }
.fe .w { font: 600 12px var(--sans); color: var(--ink); }
.fe .x { font: 11px var(--mono); color: var(--ink-3); }
.fe .k { justify-self: start; font: 600 11px var(--sans); padding: 1px 8px; border-radius: 999px; color: #fff; }
.fe .tx { grid-column: 2; font-size: 13px; color: var(--ink-2); white-space: pre-wrap; overflow-wrap: anywhere; }
.draw { animation: draw 1s ease-out both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .draw { animation: none; } }
@media (max-width: 1080px) { .main { grid-template-columns: minmax(0, 1fr); } .ticket { position: static; max-height: none; } .hint { display: none; } }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .rail { display: none; } .picker { display: block; } .content { padding-inline: 16px; } }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 22px; } }
.picker select { width: 100%; font: 500 14px var(--sans); padding: 8px 10px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); }
</style>
<style>html,body{margin:0} [hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>


<div class="app">
  <nav class="rail" id="rail" aria-label="Games"></nav>
  <main class="content">
    <div class="picker"><label class="label" for="pick">Game</label><select id="pick"></select></div>
    <div id="view"><p class="loading">Loading…</p></div>
  </main>
</div>

<script>
(function () {
  // ---------------- catalog: all 50 games, their recording status ----------------
  const ST = {
    ready: ['Replay', 'c3'], replay: ['Replay, reasoning not recorded yet', 'c1'], partial: ['Recorded with reasoning, replay next', 'c1'], fixed: ['Rule fixed, re-recording queued', 'c1'],
    old: ['Old recording without reasoning', 'c4'], earlier: ['Recorded by another model, re-recording', 'c4'], cut: ['Recording incomplete', 'c2'], none: ['Not recorded yet', 'muted'] };
  const CAT = [
    ['Negotiation and bargaining', [
      ['eco_bargaining', 'Bargaining', 'ready', 2, 'A buyer with a budget and a seller with a cost haggle over one item; the seller can be given one of several personas.'],
      ['eco_agenticpay', 'AgenticPay', 'ready', 2, 'Price negotiation across 13 task types; the later a deal closes, the more its score is discounted.'],
      ['eco_grounding_negotiation', 'Talk is Cheap', 'ready', '2 or 5', 'Players share a pool of materials and each has a private project; they chat freely, then order materials at the same time.'],
      ['eco_colored_trails', 'Colored Trails', 'ready', 2, 'Players trade colored chips to move across a board; they can pay for commitments or sign programmatic contracts.'],
      ['eco_used_car', 'Used-car market', 'ready', 'many', 'A lemons market from Agent Bazaar: sellers may run sock-puppet accounts and buyers judge quality from reputation.'],
      ['eco_pirate_game', 'Pirate game', 'ready', 10, 'Pirates propose splits of the coins in order of seniority; a proposal needs half the votes or its proposer goes overboard.']]],
    ['Cooperation and social dilemmas', [
      ['eco_sanction_pgg', 'Sanctioned public goods', 'ready', 7, 'Each round players choose whether to join a sanctioning institution, contribute, and pay to punish or reward others.'],
      ['eco_gossip_reciprocity', 'Gossip and donation', 'ready', '5 or 9', 'A donation game with public gossip that tests indirect reciprocity; every move comes with a written reason.'],
      ['eco_investesg', 'InvestESG', 'ready', 8, 'Companies split money between mitigation, greenwashing and resilience while ESG-minded investors choose whom to fund over a century of climate risk.'],
      ['eco_rice_n', 'RICE-N', 'ready', 5, 'A climate-economy model of regions that negotiate bilaterally or in clubs, with trade and tariffs.'],
      ['eco_network_adoption', 'Network adoption', 'ready', 2, 'Adopting a technology standard with network effects (Katz and Shapiro): it is worth more when others use it too.'],
      ['eco_congestion', 'Congestion', 'ready', 2, 'Two drivers choose between two roads (Rosenthal); a road gets slower the more drivers take it.']]],
    ['Information, signaling and persuasion', [
      ['eco_signal_catdog', 'Cat and dog signaling', 'ready', 2, 'One player sees whether a cat or a dog appears and signals with a light; the other must act without a shared convention.'],
      ['eco_bayesian_persuasion', 'Bayesian persuasion', 'ready', 2, 'A sender designs how much to reveal to sway a receiver, in three settings: reference letters, a courtroom and law enforcement.']]],
    ['Auctions and pricing', [
      ['eco_penny_auction', 'Penny auction', 'ready', 3, 'Every bid costs a fee and one bid is registered per countdown; the auction now opens with the first bid already placed, as in the paper.'],
      ['eco_price_war', 'Price war', 'ready', 5, 'An Agent Bazaar market where consumers arrive at random and some firms are tasked with keeping prices stable.'],
      ['eco_inventory_collusion', 'Inventory duopoly', 'ready', 2, 'Two sellers with perishable, limited stock set prices; an index measures whether they tacitly collude.']]],
    ['Supply chains and labor markets', [
      ['eco_beer_game', 'Beer game', 'ready', 4, 'A four-stage supply chain where each stage sees only its own information: the classic bullwhip effect.'],
      ['eco_ai_labor_market', 'AI labor market', 'ready', '8 of 10', 'A gig market where workers bid for jobs or spend time training, and clients pick on quality, price and reputation.']]],
    ['Financial trading', [
      ['eco_investorbench', 'InvestorBench', 'ready', 1, 'Single-asset trading on the authors’ public price and news data.'],
      ['eco_liquidation_2p', 'Two-trader liquidation', 'ready', 2, 'Two traders unload large blocks at the same time in an Almgren–Chriss market (from FinRL-Meta).'],
      ['eco_abides', 'ABIDES', 'ready', 1, 'An ABIDES-Gym exchange: investing over a day or executing a large order.'],
      ['eco_mars', 'MarS', 'ready', '1 or 2', 'Executing against order flow generated by MarS’s market model.'],
      ['eco_twinmarket_lite', 'TwinMarket', 'ready', 4, 'Four model investors among 96 rule-based ones, with social posts and rumors.'],
      ['eco_marketsim_talk', 'MarketSim', 'ready', 4, 'Model fund managers each direct 295 traders in a market of 12,000, with news shocks and public comments.'],
      ['eco_qfinzero', 'QFinZero', 'ready', 1, 'Simulated trading through tool calls, with every data source locked to the current date.'],
      ['eco_finrl_daily', 'FinRL daily', 'ready', 1, 'Daily replay of one stock (AAPL, JPM and others) with five position levels.'],
      ['eco_market_impact', 'Market impact', 'ready', 1, 'FinRL-Meta stock trading where the trader’s own orders move the price.'],
      ['eco_trading_regime', 'Regime trading', 'ready', 1, 'A market that switches between bull and bear regimes; one trader sets a position each round.'],
      ['eco_trading_impact', 'Regime trading with impact', 'ready', 2, 'The same regime-switching market with two traders whose combined orders move the price.']]],
    ['Earlier games: repeated 2x2', [
      ['eco_sc1', 'Selten-Chmura game 1', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 18; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc2', 'Selten-Chmura game 2', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 13; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc3', 'Selten-Chmura game 3', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 14; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc4', 'Selten-Chmura game 4', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 11; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc5', 'Selten-Chmura game 5', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 9; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc6', 'Selten-Chmura game 6', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), constant sum 8; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc7', 'Selten-Chmura game 7', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 1; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc8', 'Selten-Chmura game 8', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 2; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc9', 'Selten-Chmura game 9', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 3; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc10', 'Selten-Chmura game 10', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 4; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc11', 'Selten-Chmura game 11', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 5; play is compared with their human data and the mixed equilibrium.'],
      ['eco_sc12', 'Selten-Chmura game 12', 'ready', 2, 'A repeated 2x2 game from Selten and Chmura (2008), non-constant sum, same equilibrium as game 6; play is compared with their human data and the mixed equilibrium.'],
      ['eco_ghp4', 'GHP game 4', 'ready', 2, 'A repeated 2x2 game from Goeree, Holt and Palfrey (2003, game 4): the row player wants to mismatch, the column player to match; compared with human data.']]],
    ['Earlier games: economics classics', [
      ['eco_bertrand', 'Bertrand competition', 'ready', '2', 'Firms set prices; the cheapest sells to the whole market. Can they keep prices above cost?'],
      ['eco_cournot', 'Cournot competition', 'ready', '2', 'Firms choose quantities; the market price falls with total output.'],
      ['eco_commons', 'Common-pool resource', 'ready', 'several', 'Players extract from a shared, regrowing resource; overuse depletes it for everyone.'],
      ['eco_min_effort', 'Minimum effort', 'ready', 'several', 'Everyone picks an effort level; the payoff depends on the group minimum, so coordination is fragile.'],
      ['eco_public_goods', 'Public goods', 'ready', '4', 'Players contribute to a common pot that is multiplied and shared equally; free riding pays individually.'],
      ['eco_sealed_auction', 'Sealed-bid auction', 'ready', 'several', 'Bidders with private values submit sealed bids; the highest bid wins.'],
      ['eco_volunteer', 'Volunteer\u2019s dilemma', 'ready', 'several', 'One volunteer is enough to provide a good for all, but volunteering is costly.']]]];
  const NOTE = {
    old: 'This game was recorded on 2026-11-09, before reasoning was saved. It is queued for re-recording with reasoning; its replay will appear here once that run is done.',
    cut: 'A recording with reasoning started on 2026-11-10 but the cluster outage stopped it before the game finished, so there is no complete game yet. It is queued for re-recording.',
    none: 'This game has not been recorded yet: the 2026-11-09 run stopped when the API balance ran out. It is queued, budget permitting.',
    partial: 'This game was recorded with reasoning on 2026-11-09; its replay page is being built.',
    earlier: 'This game was added in the first eco pull request and recorded then by another team with a different model (gpt-6-luna), without reasoning. It is being re-recorded with DeepSeek and reasoning.',
    fixed: 'Both earlier recordings ended at once because every bidder passed on the opening bid. The rule now follows the paper (the first bid is already placed), and the game will be re-recorded.' };
  const NOHIST = new Set(['eco_beer_game', 'eco_colored_trails', 'eco_grounding_negotiation', 'eco_inventory_collusion', 'eco_penny_auction',
