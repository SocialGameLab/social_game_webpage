<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Match Room</title>
  <meta name="description" content="Rules and recorded LLM-agent matches from social-game-env.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/room.css">
  <link rel="stylesheet" href="assets/css/home.css">
  <!-- Each game's view.css is added on demand by MatchRoom.loadGame. -->
</head>
<body>
  <header class="masthead">
    <a class="masthead__brand" href="#" data-home>
      <span class="wordmark">Match Room</span>
      <span class="masthead__sub">social-game-env · recorded LLM-agent games</span>
    </a>
    <nav class="game-nav" aria-label="Games">
      <a class="nav-link" href="#" data-home>Home</a>
      <select id="game-select" class="game-select" aria-label="Go to a game"></select>
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme">◐</button>
  </header>

  <main id="app" tabindex="-1">
    <noscript>This page needs JavaScript to show the games.</noscript>
  </main>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/home.js"></script>
  <script src="data/manifest.js"></script>
  <!-- Each game's view.js and data/<id>.js are added on demand by MatchRoom.loadGame. -->
  <script src="assets/js/app.js"></script>
</body>
</html>
