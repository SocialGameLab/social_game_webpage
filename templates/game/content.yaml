# __TITLE__: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
#
# Every list item is one short sentence. `backticks` render as code.
id: __ID__
title: __TITLE__
kind: Game category            # groups the game menu and the home filter, e.g. "Negotiation"
players: N players · teams     # eyebrow line above the title
tagline: >-
  One or two sentences a newcomer can read in five seconds.

# Optional: draw this game with a shared view instead of site/games/__ID__/.
#   view: rounds        a kind in site/kinds/ (rounds, deals, clues, table, race),
#   view_options: {}    plus that kind's options, listed at the top of its view.js
#   view_from: avalon   or reuse another game's view as is
# With either set, the game needs no view.js or view.css of its own.

setup:
  - What each seat is dealt, and what is public versus private.
round:                         # numbered on the page
  - The first thing that happens each round.
  - The next thing.
win:
  - How the game ends and who wins.
agents:
  - What the agent's prompt contains, and how it answers.
watch_for:
  - The one or two moments in the recorded run worth pointing out.

# Optional: label for the run picker when there is more than one run.
# run_label: Script

# Runs come from social-game-env's demo/__ID__/ (recorded there with
# `python -m runners demo record __ID__`). List them here to set their order,
# and with more than one run, the `label` and `note` in the run picker. Omit
# `runs:` to show every exported run. The rules page's spec, config and rule
# doc paths come from demo/__ID__/demo.yaml too.
runs:
  - id: __ID__
