# __TITLE__: page copy and the recorded runs to show.
# Field reference: templates/game/content.yaml.
#
# Every list item is one short sentence. `backticks` render as code.
id: __ID__
title: __TITLE__
kind: Game category            # groups the game menu and the home filter, e.g. "Negotiation"
players: N players · teams     # eyebrow line above the title
tagline: >-
  One or two sentences a newcomer can read in five seconds.

# Paths inside social-game-env. Shown as "Source of truth" on the rules page;
# `config` is also what tools/record_runs.py plays and build_data.py replays
# to rebuild the first prompt.
config: configs/__ID__.yaml
spec: games/__ID__/__ID__.yaml
rules_doc: doc/games/__ID___rules.md

# How build_data.py and record_runs.py treat this game: "generic" for anything
# runners.play can drive. Add a new engine to both tools only if it cannot.
engine: generic

setup:
  - What each seat is dealt, and what is public versus private.
round:                         # numbered on the page
  - The first thing that happens each round.
  - The next thing.
win:
  - How the game ends and who wins.
agents:
  - What the agent's prompt contains, and how it answers.
watch_for:
  - The one or two moments in the recorded run worth pointing out.

# Optional: label for the run picker when there is more than one run.
# run_label: Script

# Each run: `path` is a directory under recordings/ that holds timestamped run
# directories; the newest one with a summary.json is shown. With more than one
# run, `label` and `note` appear in the run picker.
runs:
  - id: __ID__
    path: recordings/__ID__
